name: larkdeck
label: LarkDeck — Feishu streaming cards
kind: platform
version: 0.7.2
description: >
  Streaming Feishu / Lark cards for Hermes Agent. Shadows the built-in `feishu`
  platform adapter (registry last-writer-wins) and subclasses it, replacing the
  plain-text reply path with a card renderer: one card streams from the first
  token through the final answer, with a collapsible reasoning + tool panel
  (a CLS-style `💭 Thought · 🛠️ Tools` panel summary; status, elapsed and model
  in the footer), per-turn status colors on
  the panel border (green = done, red = failed, yellow = stopped), default
  coloured tool status words and a compact 12px panel/footer text profile,
  interactive
  clarify cards, and bilingual (zh / en) i18n nodes for card chrome. Note:
  markdown content is language-fixed because Feishu markdown does not carry
  i18n_content: tool action/status words are fixed English; footer status,
  pending placeholder, round headings, trim/continuation notices and section
  headings are fixed Chinese defaults. Only plain_text/i18n nodes follow the
  client language.

  No Hermes source file is modified and no monkeypatching is used, so a Hermes
  upgrade never requires reinstalling or re-patching this plugin.
author: zayn-0101
license: MIT
homepage: https://github.com/zayn-0101/larkdeck
tags: [feishu, lark, streaming, cards, ui]
# 插件配置写在 config.yaml 的 plugins.entries.larkdeck.settings.<key>；
# 同名环境变量 LARKDECK_<KEY> 优先。default 与代码 _DEFAULTS 保持一致。
config_schema:
  cards:
    type: boolean
    default: true
    description: "用卡片渲染回复；任何卡片失败自动回落纯文本"
  native_streaming:
    type: boolean
    default: true
    description: "官方 native streaming：一回合一张卡（工具进度合入同卡）；失败自动回落"
  clarify_cards:
    type: boolean
    default: true
    description: "澄清提问用交互卡；无线索或其他失败时回落内置文字提问"
  native_transport:
    type: string
    default: "cardkit"
    description: "native 流式帧的传输：cardkit（默认，CardKit 实体 + 元素流式写入 = 真逐字打字机；任何一步失败自动回落）/ patch（旧路径，整卡替换；字是几个几个跳）"
  clarify_dialect:
    type: string
    default: "2.0"
    description: "澄清卡方言：2.0（下拉+输入框，默认；真机点击已验证回调到达）/ 1.0（按钮，旧路径，真机也跑得通）"
  tool_row_icon:
    type: string
    default: "line"
    description: "工具行图标形态：line（默认，飞书官方线性图标做文本前缀——用户 2026-09-22 真机三臂对照选版：0px 垂直偏差、统一灰色）/ emoji（2026-09-21 选的 emoji 内联，保留为可切换降级）"
  unified_panel:
    type: boolean
    default: true
    description: "推理 + 工具合并为底部一个可折叠面板（数据来自官方钩子）"
  panel_expanded:
    type: boolean
    default: false
    description: "**收尾**时面板是否展开（默认收起；展开态很占屏）。运行中的展开态见 streaming_panel_expanded"
  streaming_panel_expanded:
    type: boolean
    default: true
    description: "**运行中**面板是否展开（默认 true：边跑边看过程；false = 回到全程折叠）。只作用于建卡实体；流式中间帧不带 expanded（用户手动收起不会被顶开）"
  streaming_print_ms:
    type: integer
    default: 15
    description: "客户端打字机的逐字间隔（毫秒，只对流式帧有效）；写 0 关闭打字机；超出 [1,2000] 退回默认并留 WARNING"
  reactions:
    type: boolean
    default: true
    description: "在用户消息上打「处理中」表情（飞书的输入提示）；关掉更接近 aiduPOP 的即时响应观感"
  footer_metrics:
    type: string
    default: "off"
    description: "页脚在上下文用量之外显示哪些指标：off（默认）/ basic（+ cache 缓存命中率 + api 本回合请求次数）/ full（再 + ttfb 首字节延迟）；三段都是纯文本、缺数据就少一段，绝不编 0"
  progress_lines_in_body:
    type: boolean
    default: false
    description: "核心的工具行要不要进正文（默认 false = 吃掉：空累积时逐行识别 核心多行进度并剥成空/占位，工具步骤收在「执行详情」面板里）；设 true 恢复核心那套。已知边界：core 帧失败后重发 finalize 的路径不剥；上游新增 verb 未同步时 fail-open"
  body_source:
    type: string
    default: "own"
    description: "正文来源（v0.7.0）：own（默认：只认插件 on_stream_delta(kind=text) 累积，core 帧只作刷新信号与 finalize 兜底；无绑定/绑定漂移时严格 fail-open）/ legacy（旧的剥帧路径，仅过渡回退；P2b 后删除）"
  visual_engine:
    type: string
    default: "structured"
    description: "v0.7.1 视觉层引擎：structured（**默认**，结构化元素树：状态条/面板摘要/推理 A 形态/工具行（默认 `markdown.icon` **前缀图标**；运行中走 `spinner_img_key()` 的 `custom_icon` 动图，已结束是静态线性图标。⚠️ D1′ 自研资产**待 P2 选定上传**，当前过渡态仍是借来的共享 key）/Result 与 Error 块）。`legacy` 配置路径自 v0.7.1 起**已退役**（设了只留一条退休 WARNING，行为仍是 structured）；降级渲染器由 DEGRADE 车道保留"
  card_status_header:
    type: boolean
    default: false
    description: "是否显示卡片顶部状态条（处理中蓝 / 完成绿 / 停止黄 / 出错红；false 时不渲染卡级 header）"
  show_reasoning:
    type: boolean
    default: false
    description: "是否显示推理正文（默认 false 对齐 CLS/aiduPOP：**所有车道**只留 `💭 思考 Xs` 摘要行；true 时按嵌套折叠面板展示推理全文）"
  footer:
    type: boolean
    default: true
    description: "页脚：状态 → 耗时 → 模型 → 上下文用量（v0.7.2 起**不再有短码**：短码只进日志自检行，用户可见处一律不出现）"
  show_model:
    type: boolean
    default: true
    description: "页脚里显示**模型名**（真名取自 Hermes 的 models.dev 缓存，例：`deepseek-flash` ⇒ `DeepSeek V4.1 Flash`；别名优先，数据源查不到才格式化；面板标题只放「💭 思考 / 🛠️ 工具执行」摘要）"
  context_style:
    type: string
    default: "text"
    description: "上下文用量样式：text | bar | both"
  text_profile:
    type: string
    default: "compact"
    description: "CardKit 设备字号档位：compact（默认：面板/脚注 notation、正文 normal；真机视觉待确认）/ off（不缩放）/ mobile_friendly（PC 小、手机大）/ large（正文更大）"
  theme:
    type: string
    default: "ap_lite"
    description: "观感主题：neutral（原符号）/ ap_lite（默认，抽象 emoji）/ ap_bubble（AP 泡波风格，含人物 emoji，可选）"
  panel_color_tags:
    type: boolean
    default: true
    description: "markdown 面板里是否使用 <font color>（默认 true：绿色 \u2713 / 蓝色 Running / 红色 Failed / 灰色细节；官方 Card 2.0 文档已确认语法，真机视觉待确认。客户端不认时可显式 false 走纯文本降级）"
  model_aliases:
    type: string
    default: ""
    description: "模型别名：'真名=显示名, ...' 或 {model@base_url: 显示名} 映射；另外会读 ~/.hermes/model_aliases.json（{'子串': '显示名'}，与 hermes-fry-cards 同源、改文件即生效）"
  max_reasoning_chars:
    type: integer
    default: 1200
    description: "统一面板中推理文本上限（超出部分截断并留痕）；写 0 或负数视为用默认值，不是取消上限"
  max_tool_result_chars:
    type: integer
    default: 600
    description: "统一面板中单条工具步骤行上限（超出部分截断并留痕）；写 0 或负数视为用默认值。面板显示的是参数预览，预览本身已截到 80 字符，所以这项实际极少触发"
  max_panel_steps:
    type: integer
    default: 30
    description: "统一面板步骤数上限（超出保留最近的步骤）；写 0 或负数视为用默认值"
  context_max_override:
    type: integer
    default: 0
    description: "非 0 时钉住上下文窗口上限（自动探测不准时兜底）"
requires_env:
  - name: FEISHU_APP_ID
    description: "Feishu/Lark app ID"
    prompt: "Feishu App ID"
    url: "https://open.feishu.cn/"
    password: false
  - name: FEISHU_APP_SECRET
    description: "Feishu/Lark app secret"
    prompt: "Feishu App Secret"
    url: "https://open.feishu.cn/"
    password: true
optional_env:
  - name: FEISHU_DOMAIN
    description: "Domain: 'feishu' (China) or 'lark' (International)"
    prompt: "Domain (feishu/lark)"
    password: false
  - name: FEISHU_ALLOWED_USERS
    description: "Comma-separated Feishu user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: FEISHU_ALLOW_ALL_USERS
    description: "Allow any Feishu user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: FEISHU_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: FEISHU_HOME_CHANNEL_NAME
    description: "Display name for the Feishu home channel"
    prompt: "Home channel display name"
    password: false
